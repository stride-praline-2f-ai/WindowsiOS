name: Build WindowsiOS ARM64 IPA (Xcode 27 + Xcode 26 backup)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: App bundle ID (must match the profile when signing)
        default: me.ammaar.windowsios
        required: true
        type: string
      sign_ipa:
        description: Sign with Apple Development certificate and device profile secrets
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'scripts/ci_*'
      - 'scripts/build_ios_deps.sh'
      - 'ios/**'
      - 'tests/**'
      - 'core/**'
      - 'devices/**'
      - 'host/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  ipad-profile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify portable M4 iPad 16 GiB memory and 4:3 profile
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/test_ipad_profile.c -o /tmp/winios-ipad-profile-test
          /tmp/winios-ipad-profile-test

  ipa:
    name: IPA (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            xcode_major: '27'
            lane: primary-xcode27
          - runner: macos-26
            xcode_major: '26'
            lane: backup-xcode26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'me.ammaar.windowsios' }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          # On macos-26 use an installed Xcode 26 even if the image's
          # default developer directory changes in a future image revision.
          if [[ "${{ matrix.xcode_major }}" == "26" ]]; then
            for app in /Applications/Xcode_26*.app; do
              if [[ -d "$app/Contents/Developer" ]]; then
                echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
                export DEVELOPER_DIR="$app/Contents/Developer"
              fi
            done
          fi
          xcodebuild -version
          detected="$(xcodebuild -version | awk '/^Xcode / { split($2,v,"."); print v[1] }')"
          if [[ "$detected" != "${{ matrix.xcode_major }}" ]]; then
            echo "::error::Expected Xcode ${{ matrix.xcode_major }} but found Xcode $detected" >&2
            exit 1
          fi
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen meson ninja pkg-config python

      - name: Build iOS dependencies
        run: bash scripts/build_ios_deps.sh

      - name: Build and package ARM64 device app
        run: bash scripts/ci_build_ipa.sh

      - name: Sign for registered devices (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: python3 scripts/ci_sign_app.py

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-${{ matrix.lane }}-${{ github.run_number }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-build-logs-${{ matrix.lane }}-${{ github.run_number }}
          path: |
            build/logs/
            work/ios_deps_build/*.log
          if-no-files-found: ignore
          retention-days: 7
