name: Build iPhone Duo IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: App bundle ID (must match the profile when signing)
        default: me.ammaar.windowsios
        required: true
        type: string
      sign_ipa:
        description: Sign with Apple Development certificate and device profile secrets
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'scripts/ci_*'
      - 'scripts/build_ios_deps.sh'
      - 'ios/**'
      - 'core/**'
      - 'devices/**'
      - 'host/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'me.ammaar.windowsios' }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen meson ninja pkg-config python

      - name: Build iOS dependencies
        run: bash scripts/build_ios_deps.sh

      - name: Build and package ARM64 device app
        run: bash scripts/ci_build_ipa.sh

      - name: Sign for registered devices (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: python3 scripts/ci_sign_app.py

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-iPhone-Duo-${{ github.run_number }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-build-logs-${{ github.run_number }}
          path: |
            build/logs/
            work/ios_deps_build/*.log
          if-no-files-found: ignore
          retention-days: 7

  netkvm-driver-disk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install filesystem and ISO extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full mtools

      - name: Download upstream signed VirtIO drivers
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 \
            "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso" \
            --output /tmp/virtio-win.iso
          test -s /tmp/virtio-win.iso
          ls -lh /tmp/virtio-win.iso

      - name: Extract only NetKVM Windows 11 ARM64
        run: |
          mkdir -p /tmp/virtio-extract
          7z x -y -o/tmp/virtio-extract /tmp/virtio-win.iso "NetKVM/w11/ARM64/*"
          SRC=/tmp/virtio-extract/NetKVM/w11/ARM64
          test -f "$SRC/netkvm.inf"
          test -f "$SRC/netkvm.sys"
          test -f "$SRC/netkvm.cat"
          ls -lh "$SRC"

      - name: Create FAT32 driver NVMe disk with MBR partition
        run: |
          mkdir -p build/driver-disk
          python3 - <<'PY'
          import struct
          p = "build/driver-disk/netkvm-driver.img"
          sectors = (64 * 1024 * 1024) // 512
          start = 2048
          with open(p, "wb") as f:
              f.truncate(sectors * 512)
          with open(p, "r+b") as f:
              f.seek(446)
              f.write(bytes([0x00, 0x00, 0x02, 0x00, 0x0C, 0xFE, 0xFF, 0xFF]))
              f.write(struct.pack("<II", start, sectors - start))
              f.seek(510)
              f.write(bytes([0x55, 0xAA]))
          PY
          IMG="build/driver-disk/netkvm-driver.img@@1048576"
          mformat -i "$IMG" -F -v NETKVM ::
          mcopy -i "$IMG" /tmp/virtio-extract/NetKVM/w11/ARM64/* ::
          mdir -i "$IMG" ::
          sha256sum build/driver-disk/netkvm-driver.img > build/driver-disk/SHA256SUMS

      - name: Upload driver disk image
        uses: actions/upload-artifact@v4
        with:
          name: NetKVM-Win11-ARM64-offline-driver
          path: build/driver-disk/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
