name: Build iPhone Duo IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: App bundle ID (must match the profile when signing)
        default: me.ammaar.windowsios
        required: true
        type: string
      sign_ipa:
        description: Sign with Apple Development certificate and device profile secrets
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'scripts/ci_*'
      - 'scripts/build_ios_deps.sh'
      - 'ios/**'
      - 'core/**'
      - 'devices/**'
      - 'host/**'
      - 'Makefile'
      - 'firmware/**'
      - 'tests/test_m4_firmware.py'
      - 'tests/test_ios_profile.c'

permissions:
  contents: read

# Avoid old queued Xcode 27 builds consuming the runner before the newest
# committed version of the Duo app. Other branches remain independent.
concurrency:
  group: windowsios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install EDK2 cross compiler and build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu acpica-tools nasm uuid-dev qemu-system-arm
      - name: Build M4 ArmVirt guest firmware
        run: bash scripts/ci_build_m4_firmware.sh
      - name: Check model, RAM boundaries and guest framebuffer
        run: |
          cc -std=c11 -Wall -Werror -Iios/Sources/Native tests/test_ios_profile.c -o "$RUNNER_TEMP/test_ios_profile"
          "$RUNNER_TEMP/test_ios_profile"
          python3 tests/test_m4_firmware.py build/firmware/m4-1600x1200.fd
      - uses: actions/upload-artifact@v4
        with:
          name: m4-armvirt
          path: build/firmware/
          if-no-files-found: error
  ipa:
    needs: m4-firmware
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'me.ammaar.windowsios' }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: m4-armvirt
          path: build/firmware

      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          # Capture xcodebuild output exactly once. Piping it through head -n 1
          # closes stdout early and can abort the Xcode CLI with SIGPIPE.
          xcode_version_output="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version_output"
          if [[ ! "$xcode_version_output" =~ ^Xcode[[:space:]]+27([.]|[[:space:]]|$) ]]; then
            echo "::error::This build requires Xcode 27; found: ${xcode_version_output%%
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen meson ninja pkg-config python

      - name: Build iOS dependencies
        run: bash scripts/build_ios_deps.sh

      - name: Build and package ARM64 device app
        run: bash scripts/ci_build_ipa.sh

      - name: Sign for registered devices (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: python3 scripts/ci_sign_app.py

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-iPhone-Duo-${{ github.run_number }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-build-logs-${{ github.run_number }}
          path: |
            build/logs/
            work/ios_deps_build/*.log
          if-no-files-found: ignore
          retention-days: 7
\n'*}" >&2
            exit 1
          fi
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen meson ninja pkg-config python

      - name: Build iOS dependencies
        run: bash scripts/build_ios_deps.sh

      - name: Build and package ARM64 device app
        run: bash scripts/ci_build_ipa.sh

      - name: Sign for registered devices (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: python3 scripts/ci_sign_app.py

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-iPhone-Duo-${{ github.run_number }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-build-logs-${{ github.run_number }}
          path: |
            build/logs/
            work/ios_deps_build/*.log
          if-no-files-found: ignore
          retention-days: 7
