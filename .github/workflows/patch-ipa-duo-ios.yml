name: Build Patch IPA Duo for iOS
on:
  push:
    branches: [build/patch-ipa-duo-ios]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: PatchIPADuo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: patriot1889/patch-ipa-duo
          ref: f4ce0f57b43df062d800706d7dbb2b22c0be3919
          path: upstream
          persist-credentials: false
      - run: python3 prepare.py ../upstream
      - run: swift build -c release && python3 Tests/smoke.py
      - run: xcodebuild -project PatchIPADuo.xcodeproj -scheme PatchIPADuo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PatchIPADuo.app Payload/
          zip -qry PatchIPADuo.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PatchIPADuo-unsigned
          path: PatchIPADuo/PatchIPADuo.ipa
          if-no-files-found: error
